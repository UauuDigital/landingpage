<!doctype html>

  <!-- Neteja la URL ABANS de res més (fins i tot abans del pixel): SugarCRM torna aquí
       reenviant TOTS els camps del formulari (nom, email, telèfon...) com a query string.
       Sense això, aquestes dades personals quedarien a la barra d'adreces, a l'historial
       del navegador, als logs del servidor i al source_url que capturaria el pixel. -->
  <script>
  try {
    if ((window.location.search || window.location.hash) && window.history && window.history.replaceState) {
      window.history.replaceState(null, '', window.location.pathname);
    }
  } catch (e) {
    // Si replaceState no està disponible, la pàgina segueix funcionant igual
  }
  </script>

  <!-- OpenAI Ads Measurement Pixel — snippet oficial (developers.openai.com/ads/measurement-pixel). -->
  <script>
  (function (w, d, s, u) {
    if (w.oaiq) return;
    var q = function () {
      q.q.push(arguments);
    };
    q.q = [];
    w.oaiq = q;
    var js = d.createElement(s);
    js.async = true;
    js.src = u;
    var f = d.getElementsByTagName(s)[0];
    f.parentNode.insertBefore(js, f);
  })(window, document, "script", "https://bzrcdn.openai.com/sdk/oaiq.min.js");

  oaiq("init", {
    pixelId: "QByt2ai5bMmJ4QseTuTBuH",
  });
  </script>
  <!-- End OpenAI Ads Measurement Pixel -->

  <!-- Umami Cloud — analítica de visites (trackeja utm_source/utm_campaign automàticament) -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="9e3fe141-1c09-457b-b9cb-37bb5645d49f"></script>

  <!-- Script propi: dispara la conversió si venim del formulari.
       0) si ja hem disparat en aquesta pestanya (uauu_lead_event_fired) → no fem res.
          Sense això, un simple F5 a gracies.html tornaria a entrar pel pla B (el
          referrer del CRM sobreviu a una recàrrega) i duplicaria la conversió amb
          un event_id diferent, impossible de deduplicar per OpenAI.
       1) event_id a sessionStorage (cas normal, desat per js/form.js) → el fem servir,
          l'esborrem i marquem el flag.
       2) sense clau però referrer del CRM (sessionStorage bloquejat: navegació privada, etc.)
          → generem un event_id nou, disparem i marquem el flag igualment. És preferible
          comptar de més que perdre conversions sense assabentar-nos-en.
       3) ni clau ni referrer del CRM (visita directa) → no disparem res.
       Tot en try/catch: el tracking mai ha de trencar la pàgina de gràcies. Únic residu
       acceptable: emmagatzematge bloquejat A MÉS de recàrrega (no es pot marcar el flag).

       lead_source per a Umami: reutilitza el mateix valor ja resolt i desat per
       js/form.js (uauu_lead_source, el que rep el CRM), no el recalcula — gracies.html
       ja ha netejat la URL abans que arribi aquí, així que no hi ha utm_source a llegir.
       Es dispara amb el mateix guard que el pixel d'OpenAI (mateix bloc, mateix flag):
       una sola conversió per pestanya, mai duplicada en recarregar.

       umami.track() s'ajorna a DOMContentLoaded: l'script d'Umami de més amunt porta
       `defer`, però `defer` només afecta scripts externs (amb `src`) — en un script
       inline com aquest no fa res, i s'executaria igualment durant el parsing, abans
       que `window.umami` existeixi. DOMContentLoaded sí que dispara després que tots
       els scripts defer hagin corregut, així que és el punt segur per cridar-lo.
       oaiq no té aquest problema (la seva pròpia cua interna ja encua les crides fetes
       abans que el script real carregui) i es manté disparant-se a l'instant, com abans. -->
  <script>
  (function () {
    var FIRED_KEY = 'uauu_lead_event_fired';
    var DEFAULT_LEAD_SOURCE = 'web_directe'; // ha de coincidir amb DEFAULT_LEAD_SOURCE a js/form.js
    var eventId = null;

    try {
      if (sessionStorage.getItem(FIRED_KEY)) return;
    } catch (e) {
      // sessionStorage no disponible: no podem comprovar el flag, seguim
    }

    try {
      eventId = sessionStorage.getItem('uauu_lead_event_id');
      if (eventId) sessionStorage.removeItem('uauu_lead_event_id');
    } catch (e) {
      // sessionStorage no disponible
    }

    if (!eventId) {
      try {
        if (new URL(document.referrer).hostname === 'crm.espaigastronomia.cat') {
          eventId = (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function')
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        }
      } catch (e) {
        // document.referrer buit o no parsejable: no venim del CRM
      }
    }

    if (eventId) {
      var leadSource = DEFAULT_LEAD_SOURCE;
      try {
        leadSource = sessionStorage.getItem('uauu_lead_source') || DEFAULT_LEAD_SOURCE;
        sessionStorage.removeItem('uauu_lead_source');
      } catch (e) {
        // sessionStorage no disponible: ens quedem amb el valor per defecte
      }

      try {
        oaiq('measure', 'lead_created', { type: 'customer_action' }, { event_id: eventId });
        sessionStorage.setItem(FIRED_KEY, '1');
      } catch (e) {
        // El tracking mai ha de trencar la pàgina de gràcies
      }

      var fireUmami = function () {
        try {
          if (typeof umami !== 'undefined') {
            umami.track('lead_created', { lead_source: leadSource });
          }
        } catch (e) {
          // El tracking mai ha de trencar la pàgina de gràcies
        }
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fireUmami);
      } else {
        // El DOM ja estava carregat quan hem arribat aquí (script tard o reexecutat)
        fireUmami();
      }
    }
  })();
  </script>
