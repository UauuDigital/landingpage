  <!-- OpenAI Ads Measurement Pixel — snippet oficial (developers.openai.com/ads/measurement-pixel). debug:true és temporal, es treu a la fase 3. -->
  <script>
  (function (w, d, s, u) {
    if (w.oaiq) return;
    var q = function () {
      q.q.push(arguments);
    };
    q.q = [];
    w.oaiq = q;
    var js = d.createElement(s);
    js.async = true;
    js.src = u;
    var f = d.getElementsByTagName(s)[0];
    f.parentNode.insertBefore(js, f);
  })(window, document, "script", "https://bzrcdn.openai.com/sdk/oaiq.min.js");

  oaiq("init", {
    pixelId: "QByt2ai5bMmJ4QseTuTBuH",
    debug: true,
  });
  </script>
  <!-- End OpenAI Ads Measurement Pixel -->

  <!-- Script propi: dispara la conversió si venim del formulari.
       1) event_id a sessionStorage (cas normal, desat per js/form.js) → el fem servir i l'esborrem.
       2) sense clau però referrer del CRM (sessionStorage bloquejat: navegació privada, etc.)
          → generem un event_id nou i disparem igualment. És preferible comptar de més
          que perdre conversions sense assabentar-nos-en.
       3) ni clau ni referrer del CRM (recàrrega, visita directa) → no disparem res.
       Tot en try/catch: el tracking mai ha de trencar la pàgina de gràcies. -->
  <script>
  (function () {
    var eventId = null;

    try {
      eventId = sessionStorage.getItem('uauu_lead_event_id');
      if (eventId) sessionStorage.removeItem('uauu_lead_event_id');
    } catch (e) {
      // sessionStorage no disponible
    }

    if (!eventId) {
      try {
        if (new URL(document.referrer).hostname === 'crm.espaigastronomia.cat') {
          eventId = (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function')
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        }
      } catch (e) {
        // document.referrer buit o no parsejable: no venim del CRM
      }
    }

    if (eventId) {
      try {
        oaiq('measure', 'lead_created', { type: 'customer_action' }, { event_id: eventId });
      } catch (e) {
        // El tracking mai ha de trencar la pàgina de gràcies
      }
    }
  })();
  </script>
